[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "getchwrap"
version = "2026.11.11.0"
dependencies = [
  "pexpect",
]
requires-python = ">=3.8"
authors = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
maintainers = [
  {name = "Ernesto Alfonso", email = "erjoalgo@gmail.com"},
]
description = "A subprocess wrapper to ergonomically eliminate redundant typing"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["getchar", "git", "ergonomic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Topic :: Terminals",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/erjoalgo/getchwrap"
Documentation = "https://github.com/erjoalgo/getchwrap"
Repository = "https://github.com/erjoalgo/getchwrap"
"Bug Tracker" = "https://github.com/erjoalgo/getchwrap/issues"

[project.scripts]
getchwrap = "getchwrap.getchwrap:main"

